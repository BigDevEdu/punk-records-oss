# Opcional: HTTPS automático com Caddy quando não há proxy de plataforma ocupando 80/443.
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PR_DOMAIN: ${PR_DOMAIN:?defina PR_DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
