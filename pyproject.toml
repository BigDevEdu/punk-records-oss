[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "punk-records"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "epochdb[embeddings,duckdb] @ git+https://github.com/jersobh/epochdb@ee824686d5164a0e2509d3c0243c4e20314077e0",
  "pyyaml",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
punk-records = "punk_records.cli:main"

[tool.setuptools]
packages = ["punk_records"]
